[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-council"
version = "4.0.0"
description = "Claim-centric multi-agent deliberation"
requires-python = ">=3.10"
dependencies = ["httpx>=0.24", "fastapi>=0.100", "uvicorn>=0.22"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
ai-council = "ai_council.cli:main"

[tool.setuptools.packages.find]
include = ["ai_council*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.package-data]
"ai_council.web" = ["static/*.html"]
