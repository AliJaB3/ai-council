<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شورای هوش مصنوعی</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#080b10;color:#e6eaf1}*{box-sizing:border-box}body{margin:0}header{padding:1rem 1.5rem;background:#111722;border-bottom:1px solid #263041;display:flex;justify-content:space-between;align-items:center}h1{font-size:1.2rem;margin:0}small,.muted{color:#98a6b9}.layout{display:flex;min-height:calc(100vh - 60px)}nav{width:245px;background:#10151e;padding:1rem;flex-shrink:0}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #334257;background:#1c2939;color:#e6eaf1;border-radius:9px;padding:.65rem 1rem}button:hover,button.active{background:#315c85;border-color:#60b6f6}nav button{display:block;width:100%;text-align:right;margin-bottom:.5rem}main{padding:1.5rem;width:100%;max-width:1500px;margin:auto;overflow:hidden}.tab{display:none}.tab.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1rem}.card{background:#121923;border:1px solid #263346;border-radius:14px;padding:1rem;margin-bottom:1rem;overflow-wrap:anywhere}h2{font-size:1.3rem}h3{margin:.2rem 0 .8rem}input,textarea{background:#080e16;color:#fff;border:1px solid #344357;border-radius:9px;padding:.8rem;width:100%;margin-bottom:.7rem}textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:.5rem;flex-wrap:wrap}.badge{display:inline-block;background:#24394c;color:#a9d9ff;border-radius:20px;padding:.2rem .6rem;font-size:.8rem}progress{width:100%;height:12px;accent-color:#60b6f6}pre,code{direction:ltr;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere}#log{max-height:220px;overflow:auto;direction:ltr;text-align:left;font-size:.8rem}svg{width:100%;min-height:120px}table{border-collapse:collapse;width:100%}td,th{padding:.6rem;border-bottom:1px solid #293444;text-align:right} .scroll{overflow:auto} .error{color:#ff9d9d}dialog{background:#121923;color:#fff;border:1px solid #44566b;border-radius:14px;max-width:min(850px,95vw);max-height:90vh}dialog::backdrop{background:#000b}@media(max-width:700px){.layout{display:block}nav{display:flex;width:100%;overflow:auto;gap:.4rem;padding:.6rem}nav button{white-space:nowrap;width:auto;margin:0}main{padding:1rem}header{padding:1rem}}
</style></head><body><header><h1>🏛️ شورای هوش مصنوعی</h1><small>داشبورد زنده</small></header><div class="layout"><nav id="nav"><button class="active" data-tab="chamber">🏛️ تالار زنده شورا</button><button data-tab="telemetry">📊 تله‌متری صندلی‌ها</button><button data-tab="workshop">💡 کارگاه ایده‌سازی</button><button data-tab="archive">🔍 جستجو و آرشیو</button><button data-tab="memory">🧠 مموری و قرنطینه</button></nav><main>
<section id="chamber" class="tab active"><h2>تالار زنده شورا</h2><div class="card"><textarea id="topic" placeholder="موضوع تصمیم را بنویسید..."></textarea><div class="actions"><button id="deep">مناظره عمیق</button><button id="fast">مسیر سریع</button></div><p id="runStatus" class="muted">آماده برای شروع</p><progress id="progress" value="0" max="100"></progress></div><div id="seatCards" class="grid"></div><div class="card"><h3>رویدادهای زنده</h3><pre id="log"></pre></div><div class="card"><h3>نمودار ادعا، شواهد و اعتراض‌ها</h3><svg id="graph" role="img" aria-label="نمودار شورا"></svg></div><div class="card"><h3>رأی داور</h3><div id="verdict" class="muted">هنوز رأیی ثبت نشده است.</div><p>اطمینان: <span id="confidence">۰</span>/۱۰</p><progress id="confidenceBar" value="0" max="10"></progress></div></section>
<section id="telemetry" class="tab"><h2>تله‌متری صندلی‌ها</h2><div class="card scroll"><table><thead><tr><th>صندلی</th><th>مدل فعال / جایگزین‌ها</th><th>Brier</th><th>وزن</th><th>مدار شکن</th></tr></thead><tbody id="seatTable"></tbody></table></div></section>
<section id="workshop" class="tab"><h2>کارگاه ایده‌سازی</h2><div class="card"><input id="workTopic" placeholder="موضوع کارگاه"><button id="workRun">اجرای کارگاه</button><p id="workStatus"></p></div><div id="ideas" class="grid"></div></section>
<section id="archive" class="tab"><h2>جستجو و آرشیو</h2><input id="search" placeholder="جستجوی تصمیم‌ها"><div id="results"></div></section>
<section id="memory" class="tab"><h2>مموری و قرنطینه</h2><div id="memoryCounts" class="card"></div><div id="memories"></div></section>
</main></div><dialog id="drawer"><button id="closeDrawer">بستن</button><div id="drawerBody"></div></dialog><script>
const $=id=>document.getElementById(id); const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opts){const r=await fetch(url,opts);if(!r.ok)throw Error((await r.text())||r.statusText);return r.json()}const post=(url,body)=>api(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
function showError(id,e){$(id).textContent='خطا: '+e.message;$(id).classList.add('error')}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active');if(b.dataset.tab==='archive')loadArchive();if(b.dataset.tab==='memory')loadMemory();if(b.dataset.tab==='workshop')loadIdeas();if(b.dataset.tab==='telemetry')loadSeats()});
async function loadSeats(){try{const seats=await api('/api/v1/seats/status');$('seatCards').innerHTML=seats.map(s=>`<div class="card"><h3>${esc(s.avatar)} ${esc(s.title)}</h3><span class="badge">${esc(s.status)}</span><p dir="ltr">${esc(s.model)}</p><small>${esc(s.latency_ms)} ms</small></div>`).join('');$('seatTable').innerHTML=seats.map(s=>`<tr><td>${esc(s.avatar)} ${esc(s.title)}</td><td dir="ltr">${esc(s.model)}<br><small>${esc(s.checkpoints.join(' · '))}</small></td><td>${s.brier_score==null?'—':Number(s.brier_score).toFixed(4)}</td><td>${Number(s.weight).toFixed(2)}</td><td>${esc(s.circuit_breaker)}</td></tr>`).join('')}catch(e){showError('runStatus',e)}}
function drawGraph(g){const nodes=[...(g.claims||[]).map(x=>['ادعا',x]),...(g.evidence||[]).map(x=>['شواهد',x]),...(g.objections||[]).map(x=>['اعتراض',x])];const svg=$('graph');svg.setAttribute('viewBox',`0 0 800 ${Math.max(120,nodes.length*55+20)}`);svg.innerHTML=nodes.map(([type,n],i)=>`<g transform="translate(10 ${i*55+10})"><rect width="780" height="45" rx="8" fill="#1c2b3b"/><text x="765" y="28" text-anchor="end" fill="#dce9f6" font-size="14">${esc(type)}: ${esc(String(n.text||n.claim||n.challenge_point||n.id||JSON.stringify(n)).slice(0,95))}</text></g>`).join('')}
function renderSnapshot(s){$('runStatus').textContent=s.status;const v=s.verdict||{};$('verdict').innerHTML=['executive_verdict','emergent_architecture','consensus_analysis','implementation_blueprint','risk_matrix','kill_switch_criteria'].filter(k=>v[k]).map(k=>`<h4 dir="ltr">${esc(k.replaceAll('_',' '))}</h4><div style="white-space:pre-wrap">${esc(v[k])}</div>`).join('')||esc(v.error||'در انتظار رأی');$('confidence').textContent=s.confidence_score;$('confidenceBar').value=s.confidence_score;drawGraph(s.graph||{});if(s.opinions?.length){$('seatCards').innerHTML=s.opinions.map(o=>`<div class="card"><h3>${esc(o.avatar)} ${esc(o.title||o.role)}</h3><span class="badge">${esc(o.stance)}</span><p dir="ltr">${esc(o.model_used)}</p><small>${esc(o.latency_ms)} ms</small></div>`).join('')}}
let source;async function start(deep){try{if(source)source.close();$('log').textContent='';$('progress').value=0;const run=await post('/api/v1/convene',{topic:$('topic').value,deep,fast_path:!deep});$('runStatus').textContent='PENDING';source=new EventSource(`/api/v1/runs/${run.run_id}/stream`);let count=0;const types=['RUN_STARTED','SESSION_STARTED','SEAT_COMMITTED','CLAIM_ADDED','OBJECTION_LINKED','EXPERIMENT_EMITTED','VERDICT_SYNTHESIZED','RUN_COMPLETED','RUN_FAILED','FORK_TESTED','EVIDENCE_PUMPED'];types.forEach(type=>source.addEventListener(type,async e=>{const item=JSON.parse(e.data);$('log').textContent+=`${item.seq} ${item.event_type} ${JSON.stringify(item.payload)}\n`;$('log').scrollTop=$('log').scrollHeight;$('progress').value=Math.min(90,++count*8);if(type==='RUN_COMPLETED'||type==='RUN_FAILED'){source.close();$('progress').value=100;try{renderSnapshot(await api(`/api/v1/runs/${run.run_id}/snapshot`))}catch(err){showError('runStatus',err)}}}));source.onerror=()=>{$('runStatus').textContent='اتصال رویدادها قطع شد؛ تلاش مجدد…'}}catch(e){showError('runStatus',e)}}$('deep').onclick=()=>start(true);$('fast').onclick=()=>start(false);
async function loadArchive(){try{let q=$('search').value;let records=await api(q?'/api/v1/search?q='+encodeURIComponent(q):'/api/v1/runs');$('results').innerHTML=records.map(s=>`<div class="card"><strong>${esc(s.topic)}</strong> <span class="badge">${esc(s.status)}</span><p class="muted">${esc(s.created_at)}</p><button data-run="${esc(s.run_id)}">مشاهده تصمیم</button></div>`).join('')||'<p class="muted">نتیجه‌ای یافت نشد.</p>';document.querySelectorAll('[data-run]').forEach(b=>b.onclick=async()=>{try{const s=await api(`/api/v1/runs/${encodeURIComponent(b.dataset.run)}/snapshot`);$('drawerBody').innerHTML=`<h2>${esc(s.topic)}</h2><p>${esc(s.status)} · ${esc(s.confidence_score)}/10</p><pre>${esc(JSON.stringify(s.verdict,null,2))}</pre>`;$('drawer').showModal()}catch(e){alert(e.message)}})}catch(e){showError('results',e)}}let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(loadArchive,250)};$('closeDrawer').onclick=()=>$('drawer').close();
async function loadIdeas(){try{const data=await api('/api/v1/workshop/ideas');$('ideas').innerHTML=data.map(i=>`<div class="card"><h3>${esc(i.title)}</h3><span class="badge">AXIOMATIC: ${i.status==='TIER_0_REJECTED'?'FAIL':'PASS'}</span> <span class="badge">${esc(i.status)}</span><p>${esc(i.problem_statement)}</p><strong>Causal Mechanism</strong><pre>${esc(JSON.stringify(i.causal_mechanism,null,2))}</pre><strong>Falsification</strong><p>${esc(i.cheapest_falsification_test)}</p></div>`).join('')}catch(e){showError('workStatus',e)}}$('workRun').onclick=async()=>{try{$('workStatus').textContent='در حال اجرا…';await post('/api/v1/workshop/run',{topic:$('workTopic').value});$('workStatus').textContent='انجام شد';loadIdeas()}catch(e){showError('workStatus',e)}};
async function loadMemory(){try{const data=await api('/api/v1/evomem/status');$('memoryCounts').textContent=Object.entries(data.counts).map(([k,v])=>`${k}: ${v}`).join(' · ');$('memories').innerHTML=data.quarantined.map(m=>`<div class="card"><pre>${esc(JSON.stringify(m.payload,null,2))}</pre><button data-memory="${esc(m.id)}">اعتبارسنجی و ارتقا</button></div>`).join('')||'<p class="muted">حافظه‌ای در قرنطینه نیست.</p>';document.querySelectorAll('[data-memory]').forEach(b=>b.onclick=async()=>{try{await post(`/api/v1/evomem/${encodeURIComponent(b.dataset.memory)}/promote`,{});loadMemory()}catch(e){alert(e.message)}})}catch(e){showError('memoryCounts',e)}}loadSeats();
</script></body></html>
